services:
  api:
    runtime: "${CONTAINER_RUNTIME:-runc}"
    build:
      context: .
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MODEL_PATH: /app/model_config.json
      BAN_DB_PATH: /data/ban/ban.sqlite
    volumes:
      - ban_data:/data/ban
    ports:
      - "${ADDRESS_API_BIND:-127.0.0.1}:${ADDRESS_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ui:
    runtime: "${CONTAINER_RUNTIME:-runc}"
    build:
      context: .
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    command: ["streamlit", "run", "ui.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_URL: http://api:8000
      NO_PROXY: api,host.docker.internal,localhost,127.0.0.1,.bosch.com
      no_proxy: api,host.docker.internal,localhost,127.0.0.1,.bosch.com
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped

  ban-loader:
    runtime: "${CONTAINER_RUNTIME:-runc}"
    build:
      context: .
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    profiles: ["tools"]
    entrypoint: ["python", "/app/scripts/download_ban.py"]
    command: ["--departments", "13"]
    environment:
      BAN_DB_PATH: /data/ban/ban.sqlite
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1}"
    volumes:
      - ban_data:/data/ban

volumes:
  ban_data:
